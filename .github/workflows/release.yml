name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(awk -F'\"' '/^version = /{print $2; exit}' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/oxidetime" dist/oxidetime
          codesign --force --sign - --timestamp=none dist/oxidetime
          codesign --verify --strict dist/oxidetime
          tar -czf "dist/oxidetime-${version}-${{ matrix.target }}.tar.gz" -C dist oxidetime
          rm dist/oxidetime
          shasum -a 256 dist/*.tar.gz | tee "dist/oxidetime-${version}-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: oxidetime-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
